[global]
   workgroup = WORKGROUP
   server string = JuiceFS on R2
   netbios name = JUICEFS
   security = user
   map to guest = never
   server min protocol = SMB2
   server max protocol = SMB3
   log level = 1
   log file = /var/log/samba/smbd.log
   max log size = 1000

   # ── Kompatibilitas macOS ──────────────────────────────────────────────
   # Modul fruit membuat Samba menangani metadata macOS secara native,
   # sehingga Finder TIDAK membuat file sampah "._namafile" seperti di WebDAV.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:nfs_aces = no

   # ── Performa ──────────────────────────────────────────────────────────
   aio read size = 1
   aio write size = 1
   use sendfile = yes
   socket options = TCP_NODELAY IPTOS_LOWDELAY

[jfs]
   comment = JuiceFS volume (Cloudflare R2)
   path = /mnt/jfs
   browseable = yes
   read only = no
   guest ok = no
   valid users = jfs
   force user = root
   force group = root
   create mask = 0644
   directory mask = 0755

   # Lindungi .trash dari Finder. Ini jaring pengaman terakhir di R2 —
   # jangan sampai terhapus dari Finder seperti insiden WebDAV.
   veto files = /.trash/
   delete veto files = no

   # Sembunyikan file kontrol JuiceFS dari Finder
   hide files = /.accesslog/.config/.stats/
